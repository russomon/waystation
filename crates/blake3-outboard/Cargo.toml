[package]
name = "blake3-outboard"
version = "0.1.0"
edition = "2021"
description = "Streaming BLAKE3 (root now; bao outboard next) for OrbitXfer Web, compiled to wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
blake3 = "1"
# v1 — verified range download. iroh/OrbitXfer use `bao-tree`; add it here to
# emit a streaming outboard the downloader can verify ranges against:
# bao-tree = "0.13"

[profile.release]
opt-level = "z"
lto = true
