[package]
name = "blake3-outboard"
version = "0.1.0"
edition = "2021"
description = "Streaming BLAKE3 (root now; bao outboard next) for OrbitXfer Web, compiled to wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
blake3 = "1"
bao = "0.13.1"

[profile.release]
opt-level = "z"
lto = true
