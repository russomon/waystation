# Compose override for scripts/docker-proof.sh: swaps real B2/GMI for a
# MinIO container and test secrets. `environment` beats env_file, so any
# real .env values are overridden for the proof run.
services:
  gateway:
    environment:
      B2_S3_ENDPOINT: http://minio:9000
      B2_REGION: us-east-1
      B2_KEY_ID: minioadmin
      B2_APP_KEY: minioadmin
      B2_BUCKET: waystation-test
      B2_FORCE_PATH_STYLE: "true"
      B2_EVENT_SIGNING_SECRET: evsecretevsecretevsecretevsecret
      PIPELINE_SHARED_SECRET: ps
      CDN_BASE: https://cdn.test
      CDN_TOKEN_SECRET: dev
  worker:
    environment:
      B2_S3_ENDPOINT: http://minio:9000
      B2_REGION: us-east-1
      B2_KEY_ID: minioadmin
      B2_APP_KEY: minioadmin
      B2_BUCKET: waystation-test
      B2_FORCE_PATH_STYLE: "true"
      PIPELINE_SHARED_SECRET: ps
      GMI_API_KEY: ""            # AI lane skips cleanly
      MANIFEST_LOCK_DAYS: "0"    # MinIO test bucket has no Object Lock
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
