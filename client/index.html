<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Gateway control-plane base. Empty = same-origin "/api" (dev, via the
         vite proxy). The export script rewrites this to the production API for
         the hosted release, so the deployed host can be changed by editing this
         one line without rebuilding. Large media never goes here — it moves
         browser <-> Backblaze B2 directly. -->
    <meta name="waystation-api" content="" />
    <!-- Pins the compute target while leaving its checked route visible and
         disabled. Empty = dev, where the sender may select Docker cloud or
         host-local compute. The gateway enforces the same pin independently. -->
    <meta name="waystation-compute" content="" />
    <title>Waystation</title>
    <style>
      :root { --blue: #2563eb; --ink: #111827; --mut: #6b7280; --line: #e5e7eb; --bg: #f8fafc; }
      * { box-sizing: border-box; }
      /* The UA stylesheet's [hidden] { display: none } loses to any author
         `display` rule — .svc sets display:flex, so a hidden service row would
         still render. Make `hidden` actually mean hidden, everywhere. */
      [hidden] { display: none !important; }
      body { font: 15px/1.6 system-ui, sans-serif; max-width: 720px; margin: 5vh auto; padding: 0 1rem; color: var(--ink); }
      h1 { margin: 0 0 .1rem; letter-spacing: 0; }
      .tag { color: var(--mut); margin: 0 0 1.4rem; }
      .card { border: 1px solid var(--line); border-radius: 8px; padding: 1.4rem 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

      .mode-switch { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; margin: 0 0 1rem;
                     border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
      .mode-switch button { min-height: 42px; border: 0; border-radius: 6px; background: transparent;
                            color: var(--mut); font: inherit; font-weight: 600; cursor: pointer; }
      .mode-switch button[aria-selected="true"] { color: var(--ink); background: #fff;
                                                   box-shadow: 0 1px 2px rgba(15,23,42,.10); }
      .mode-switch button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

      .pick { display: block; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 1.1rem 1.2rem; cursor: pointer; margin-bottom: .7rem; transition: border-color .15s, background .15s; }
      .pick:hover { border-color: var(--blue); }
      .pick strong { display: block; }
      .pick .muted { color: var(--mut); font-size: 13px; }
      .pick.has-file { border-style: solid; border-color: var(--blue); background: #eff6ff; }
      .pick.dragging { border-style: solid; border-color: var(--blue); background: #eff6ff; }
      .pick.disabled { cursor: not-allowed; opacity: .55; background: var(--bg); }

      .queue { margin: .3rem 0 1rem; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .queue li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .75rem; align-items: center;
                  min-height: 48px; padding: .55rem .75rem; border-bottom: 1px solid var(--line); }
      .queue li:last-child { border-bottom: 0; }
      .queue-file { min-width: 0; }
      .queue-file strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .queue-file span { color: var(--mut); font-size: 12.5px; }
      .remove-file { width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent;
                     color: var(--mut); font: 20px/1 system-ui, sans-serif; cursor: pointer; }
      .remove-file:hover { color: #b91c1c; background: #fef2f2; }
      .remove-file:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      .queue-note { min-height: 1.4rem; margin: -.35rem 0 .7rem; color: var(--mut); font-size: 13px; }

      .services { border: 1px solid var(--line); border-radius: 8px; margin: 1rem 0; overflow: hidden; }
      .svc-head { display: flex; justify-content: space-between; align-items: center; padding: .7rem 1rem; background: var(--bg); border-bottom: 1px solid var(--line); font-weight: 500; }
      .svc { display: flex; gap: .6rem; align-items: baseline; padding: .55rem 1rem; border-bottom: 1px solid var(--line); cursor: pointer; }
      .svc:last-child { border-bottom: 0; }
      .svc input { transform: translateY(1px); }
      .svc .muted { color: var(--mut); font-size: 12.5px; margin-left: auto; text-align: right; }
      .svc.interpretive { background: #f0fdf4; }
      .brief-row { align-items: stretch; flex-direction: column; cursor: default; background: #f8fffa; }
      .brief-row textarea { width: 100%; min-height: 74px; resize: vertical; font: inherit;
                            padding: .5rem .6rem; border: 1px solid #bbf7d0; border-radius: 6px; }
      .profile-row { font-weight: 500; cursor: default; justify-content: space-between; }
      .profile-row select { font: inherit; padding: .25rem .5rem; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
      .chip { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: 12px; font-weight: 600; margin-right: .35rem; }
      .chip.bad { background: #fee2e2; }
      .chip.warnc { background: #fef3c7; }
      .chip.mutedc { background: #f1f5f9; color: var(--mut); }

      .btn { display: inline-block; min-height: 42px; padding: .6rem 1.4rem; border-radius: 7px; background: var(--blue); color: #fff; text-decoration: none; border: 0; font: inherit; font-weight: 500; cursor: pointer; }
      .btn:disabled { background: #94a3b8; cursor: not-allowed; }
      .btn.ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
      #log { margin-top: 1rem; color: #333; }
      .batch-result { padding: .7rem 0; border-top: 1px solid var(--line); }
      .batch-result:first-child { border-top: 0; }
      .batch-result strong { display: block; overflow-wrap: anywhere; }
      .batch-result .status { color: var(--mut); font: 12.5px/1.6 ui-monospace, monospace; }
      .batch-result .status.bad { color: #b91c1c; }
      .batch-summary { margin: .4rem 0 0; font-weight: 600; }
      a { color: var(--blue); }

      @media (max-width: 560px) {
        body { margin-top: 2.5vh; }
        .card { padding: 1rem; }
        .svc { align-items: flex-start; flex-wrap: wrap; }
        .svc .muted { width: 100%; margin-left: 1.55rem; text-align: left; }
        .profile-row { display: block; }
        .profile-row select { width: 100%; margin-top: .35rem; }
      }

      .deliv { border: 1px solid var(--line); border-radius: 16px; padding: 1.25rem 1.5rem; }
      .deliv h2 { margin: .6rem 0 .1rem; }
      .deliv .meta { color: var(--mut); margin: 0 0 .8rem; font-size: 13px; }
      .deliv .summary { background: var(--bg); border-radius: 8px; padding: .7rem .9rem; }
      .deliv .summary.muted { color: #9ca3af; }
      img.thumb { width: 100%; border-radius: 10px; display: block; background: #f3f4f6; }
      .prov { margin-top: 1.1rem; border-top: 1px solid #eee; padding-top: .8rem; }
      .prov summary { cursor: pointer; font-weight: 500; }
      .mono { font: 12px/1.6 ui-monospace, monospace; color: #4b5563; word-break: break-all; }
      .qc-section { margin: .9rem 0 0; }
      .qc-section h3 { font-size: 13px; margin: 0 0 .25rem; }
      .qc-lines { white-space: pre-wrap; word-break: break-word; margin: 0; }
      .ai-run { margin-top: 1.1rem; border: 1px solid #bbf7d0; border-left: 4px solid #16a34a;
                padding: .85rem 1rem; background: #f0fdf4; border-radius: 6px; }
      .ai-run h3 { font-size: 15px; margin: 0 0 .2rem; }
      .ai-run .timeline { display: grid; grid-template-columns: minmax(130px, 1fr) auto;
                          gap: .2rem .8rem; margin: .6rem 0; }
      .ai-run .observation { background: #fff; border: 1px solid #dcfce7; padding: .65rem .75rem;
                             border-radius: 6px; margin-top: .55rem; }
      .ai-evidence { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                     gap: .5rem; margin-top: .7rem; }
      .ai-evidence img { width: 100%; display: block; border-radius: 4px; }
      /* Download progress. A 26 GB transfer runs for tens of minutes, so the
         page has to say how far along it is and roughly how long is left —
         a spinner would be indistinguishable from a hang. */
      .dlprog { margin-top: .7rem; }
      .dlbar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
      .dlbar span { display: block; height: 100%; width: 0; background: var(--blue); transition: width .2s linear; }
      .dlrow { display: flex; justify-content: space-between; gap: 1rem; margin-top: .35rem;
               font: 12.5px/1.5 ui-monospace, monospace; color: var(--mut); }
      .dlrow:first-of-type { color: var(--ink); }

      .verify { margin-top: .6rem; font: 13px/1.7 ui-monospace, monospace; }
      .verify .ok { color: #047857; }
      .verify .bad { color: #b91c1c; }
      .ok { color: #047857; }
      .warnc { color: #b45309; }
      .bad { color: #b91c1c; }
    </style>
  </head>
  <body>
    <!-- Sender access. Shown only when the gateway reports that a session is
         required; the recipient view (?t=<id>) never sees it. The code is sent
         once in exchange for an HttpOnly session cookie and is never stored by
         this page. Never prefill a real code here. -->
    <div id="gate" hidden>
      <h1>Waystation</h1>
      <p class="tag">This is a controlled preview deployment.</p>
      <div class="card">
        <label class="pick" for="accessCode" style="cursor:auto">
          <strong>Access code</strong>
          <span class="muted">Provided with your preview invitation.</span>
        </label>
        <input id="accessCode" type="password" autocomplete="one-time-code"
               spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX"
               style="width:100%;font:inherit;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px" />
        <p id="gateMsg" class="muted" style="min-height:1.4rem;margin:.6rem 0 .8rem"></p>
        <button class="btn" id="gateGo">Continue</button>
      </div>
    </div>

    <div id="sender" hidden>
      <h1>Waystation</h1>
      <p class="tag" id="senderTag">Send large files securely and share them.</p>
      <div class="mode-switch" role="tablist" aria-label="Waystation service">
        <button type="button" id="modeTransfer" role="tab" aria-selected="true"
                aria-controls="senderPanel">Transfer</button>
        <button type="button" id="modeQc" role="tab" aria-selected="false"
                aria-controls="senderPanel">Transfer + QC</button>
      </div>
      <div class="card">
        <div id="senderPanel" role="tabpanel" aria-labelledby="modeTransfer">
        <label class="pick" id="pickMaster" for="file">
          <input id="file" type="file" multiple hidden />
          <strong id="pickTitle">Choose or drop files</strong>
          <span class="muted" id="fname">Select multiple files, add them one at a time, or drag them here</span>
        </label>
        <ul class="queue" id="fileQueue" aria-label="Files ready to send" hidden></ul>
        <p class="queue-note" id="queueNote" aria-live="polite"></p>

        <div id="qcOptions" hidden>
        <label class="pick" id="pickCaps">
          <input id="capfile" type="file" accept=".srt,.vtt,.scc,.mcc,.rcwt" hidden />
          <strong>Captions sidecar <span class="muted">(optional)</span></strong>
          <span class="muted" id="capname">SRT, VTT, SCC, MCC, or RCWT</span>
        </label>
        <label class="pick" id="pickGen">
          <input id="genfile" type="file" accept=".json" hidden />
          <strong>Genblaze manifest <span class="muted">(optional)</span></strong>
          <span class="muted" id="genname">.json — the generation record; enables prompt-adherence QC</span>
        </label>

        <div class="services" id="services">
          <div class="svc-head">
            <span>Services at the waystation</span>
          </div>
          <div class="svc profile-row">
            QC profile
            <select id="profile">
              <option value="standard">Waystation Standard</option>
              <option value="us_broadcast_xdcam_hd_422_v1">U.S. broadcast XDCAM HD 4:2:2 baseline</option>
              <option value="waystation_house_xdcam_hd_422_v1">Waystation house XDCAM HD 4:2:2</option>
              <option value="netflix">Netflix strict (Backlot delivery spec)</option>
            </select>
          </div>
          <label class="svc"><input type="checkbox" id="opt_qc_av" checked />
            AV QC <span class="muted">decode &middot; black &middot; freeze &middot; silence &middot; loudness</span></label>
          <label class="svc"><input type="checkbox" id="opt_qc_captions" checked />
            Caption QC <span class="muted">timing &middot; readability &middot; coverage</span></label>
          <label class="svc"><input type="checkbox" id="opt_qc_synthetic" checked />
            Synthetic QC <span class="muted">asset blueprint &middot; continuity ledger &middot; typography</span></label>
          <label class="svc interpretive"><input type="checkbox" id="opt_ai_interpretive" checked />
            AI Interpretive Analysis <span class="muted">independent review &middot; adaptive evidence &middot; critic &middot; synthesis</span></label>
          <label class="svc brief-row" id="reviewBriefRow">
            <strong>Creative and delivery context <span class="muted">(optional)</span></strong>
            <textarea id="review_brief" maxlength="2000"
              placeholder="Expected text, approved editorial intent, or reference notes"></textarea>
          </label>
          <label class="svc"><input type="checkbox" id="opt_thumbnail" checked />
            Preview thumbnail <span class="muted">AI-selected poster frame</span></label>
          <label class="svc"><input type="checkbox" id="opt_summarize" checked />
            AI summary <span class="muted">GMI Cloud</span></label>
          <label class="svc"><input type="checkbox" id="opt_cloud" checked />
            Cloud compute <span class="muted">process at the Docker worker &middot; off = this machine</span></label>
        </div>
        </div>

        <button id="send" class="btn" disabled>Send</button>
        <div id="log" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <div id="delivery" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
